# ======================================================================
# BitHunter — Configuracao do Sistema de Clima
# ======================================================================
# Todas as duracoes estao em segundos reais (60 FPS).
# Pesos maiores = mais provavel de ser sorteado.
# ======================================================================

# Ativa/desativa o sistema de clima
weather.enabled=true

# Intervalo entre checagens de troca de clima (segundos)
weather.check_interval_seconds=60

# Duracao de cada clima — sorteio aleatorio entre min e max (segundos)
weather.min_duration_seconds=90
weather.max_duration_seconds=360

# Pesos base por tipo de clima (maiores = mais comum)
weather.weight.clear=40
weather.weight.overcast=20
weather.weight.drizzle=15
weather.weight.rain=15
weather.weight.fog=7
weather.weight.storm=3

# Bonus de peso para neblina durante DAWN (madrugada/manha)
weather.fog.dawn_bonus=15

# Bonus de peso para trovoada durante NIGHT/DUSK (noite/entardecer)
weather.storm.night_bonus=5

# Quantidade de particulas por tipo
weather.particles.drizzle.count=80
weather.particles.rain.count=150
weather.particles.storm.count=300

# Escurecimento do overlay (alpha 0.0 a 1.0)
weather.overlay.darkness.overcast=0.15
weather.overlay.darkness.drizzle=0.08
weather.overlay.darkness.rain=0.20
weather.overlay.darkness.storm=0.35

# Alpha maximo da neblina (0.0 a 1.0)
weather.fog.max_alpha=0.45

# Duracao da transicao suave entre climas (segundos)
weather.transition.fade_seconds=3.0

# Indice do SFX de trovao no array Sound (-1 = desativado).
# Para ativar, adicione um .wav de trovao ao Sound e informe o indice aqui.
weather.storm.thunder_sfx_index=-1
