############################################################
# Bestiary Creature Registry
# Formato: data-driven, sem hardcode em Java.
#
# Cada criatura eh definida por:
#   <id>.monsterRef   = internalId do monstro no engine
#   <id>.nameKey      = chave i18n para o nome (default: <monsterRef>.name)
#   <id>.class        = CreatureClass enum
#   <id>.difficulty   = BestiaryDifficulty enum
#   <id>.rarity       = BestiaryRarity enum (default: NORMAL)
#   <id>.spriteRef    = caminho do sprite (sem .png)
#   <id>.hp/speed/armor = stats base
#   <id>.behavior     = MELEE / RANGED / MIXED
#   <id>.usesSpells   = true/false
#   <id>.drops        = lista itemId:TIER separada por virgula
#   <id>.locations    = lista mapId:RegionName separada por virgula
#   <id>.completionPoints = pontos ao completar (default: 5)
############################################################

# === Classes disponiveis (ordem de exibicao na UI) ===
classes=SLIMES,ANIMAIS,HUMANOIDES,MORTOS_VIVOS

# === Lista de criaturas (ordem de carregamento) ===
creatures=greenSlime,redSlime,bat,orc,skeletonLord

############################################################
# Green Slime
############################################################
greenSlime.monsterRef=monster.greenSlime
greenSlime.class=SLIMES
greenSlime.difficulty=INOFENSIVO
greenSlime.rarity=NORMAL
greenSlime.spriteRef=/monster/greenslime_down_1
greenSlime.hp=8
greenSlime.speed=1
greenSlime.armor=0
greenSlime.behavior=RANGED
greenSlime.usesSpells=false
greenSlime.drops=item.coin.bronze:COMMON,item.heart:COMMON,item.manaCrystal:UNCOMMON
greenSlime.locations=0:World
greenSlime.completionPoints=5

